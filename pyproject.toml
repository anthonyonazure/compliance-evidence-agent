[project]
name = "compliance-evidence-agent"
version = "0.1.0"
description = "LangGraph agent that auto-collects SOC 2 evidence from M365, Entra, and Azure into a signed PDF audit pack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "b2b-agent-toolkit @ git+https://github.com/anthonyonazure/b2b-agent-toolkit@main",
    "langgraph>=0.2.40",
    "anthropic>=0.39",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "types-PyYAML>=6.0",
]

[project.scripts]
compliance = "compliance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance"]

[tool.uv.sources]
b2b-agent-toolkit = { path = "../b2b-agent-toolkit", editable = true }

# WeasyPrint ships no annotations and has no stub package on typeshed. Following
# its untyped source still gives real inference at the call site, which is
# strictly more checking than treating the module as Any.
[[tool.mypy.overrides]]
module = ["weasyprint.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

# The b2b-agent-toolkit dependency names its git source explicitly, because
# that package is not on PyPI and a bare name there is resolvable by anyone who
# registers it. Hatchling refuses direct references unless told otherwise.
[tool.hatch.metadata]
allow-direct-references = true
